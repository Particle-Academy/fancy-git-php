name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope — this workflow only reads the repo to run tests.
# Without an explicit block the job inherits the repo's default (often broad)
# GITHUB_TOKEN permissions (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ["8.3", "8.4", "8.5"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
